[project]
name = "triagegraph"
version = "1.0.0"
description = "Multi-agent IT incident triage copilot: LangGraph, hybrid RAG on Qdrant, tool calling, human-in-the-loop."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]
